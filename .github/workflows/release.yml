name: Release
on:
  create:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    name: Release on GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate GO releaser config
        uses: goreleaser/goreleaser-action@v12
        with:
          args: check

      - name: Create release on GitHub
        uses: goreleaser/goreleaser-action@v12
        with:
          args: release
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

